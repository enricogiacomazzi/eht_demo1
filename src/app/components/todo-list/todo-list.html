

<ul>
  @for (t of todos(); track t.id) {
    <todo-list-item 
        [todo]="t" 
        [pippo]="false" 
        ultimateAnswer="42"
        (toggleTodo)="ts.toggleTodo(t.id)"
        (selectTodo)="select.set(t.id)"
    />
  }
</ul>
