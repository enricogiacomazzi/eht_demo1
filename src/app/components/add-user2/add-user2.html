

<form class="needs-validation" novalidate [formGroup]="myForm" (ngSubmit)="send()">
  <div class="form-row">
    <div class="col-md-4 mb-3">
      <label for="validationCustom01">First name</label>
      <input type="text" 
        class="form-control" 
        id="validationCustom01" 
        placeholder="First name" 
        name="firstname"
        formControlName="firstname"
      >
      <div class="valid-feedback">
        Looks good!
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <label for="validationCustom02">Last name</label>
      <input type="text" 
      class="form-control"
      id="validationCustom02" 
      placeholder="Last name" 
      name="lastname"
      formControlName="lastname">
      <div class="valid-feedback">
        Looks good!
      </div>
    </div>

    <div class="col-md-4 mb-3">
      <label for="validationCustom03">Username</label>
      <input type="text" 
      class="form-control" 
      id="validationCustom03" 
      placeholder="Username" 
      name="username">
      <div class="valid-feedback">
        Looks good!
      </div>
    </div>
  </div>

  <ng-ranking formControlName="ranking" />

  <div class="form-row" formArrayName="rows">

    @for (ctrl of myForm.controls['rows'].controls; let index = $index; track index) {
            <div class="col-md-4 mb-3">
                <label for="validationCustom03">Username</label>
                <input type="text" 
                class="form-control" 
                id="validationCustom03" 
                placeholder="Username"
                [formControlName]="index"
                name="username">
                <div class="valid-feedback">
                    Looks good!
                </div>
            </div>
    }

    <button type="button" class="btn btn-primary" (click)="addRow()">Add</button>
  </div>
  <div class="form-group">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required>
      <label class="form-check-label" for="invalidCheck">
        Agree to terms and conditions
      </label>
      <div class="invalid-feedback">
        You must agree before submitting.
      </div>
    </div>
  </div>
  <button class="btn btn-primary" [disabled]="myForm.invalid" type="submit">Submit form</button>
</form>
<hr/>


<button type="button" class="btn btn-primary" (click)="tmp()">Add</button>

<hr /> 
<hr />

<div class="col-md-4 mb-3">
    <label for="Search">Search</label>
    <input type="text" 
    class="form-control" 
    id="Search"
    [formControl]="search"
    >
</div>

<ul>
    @for (user of users(); track user.id) {
        <li>{{user.name}}</li>
    }
</ul>
